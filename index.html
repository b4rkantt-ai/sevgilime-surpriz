<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sana Özel Bir Sürpriz ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #333;
      text-align: center;
    }
    /* Giriş Ekranı */
    #start-screen {
      z-index: 10;
      padding: 20px;
    }
    .start-btn {
      background-color: #ff4b2b;
      color: white;
      border: none;
      padding: 15px 35px;
      font-size: 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }
    .start-btn:hover {
      transform: scale(1.05);
      background-color: #ff416c;
    }
    /* İçerik Ekranı */
    #content {
      display: none;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      max-width: 90%;
      width: 400px;
      background: rgba(255, 255, 255, 0.85);
      padding: 30px 20px;
      border-radius: 20px;
      backdrop-filter: blur(5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      z-index: 2;
    }
    .photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff4b2b;
      margin-bottom: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }
    h1 {
      font-size: 1.5rem;
      color: #d63031;
      margin-bottom: 15px;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #2d3436;
      margin-bottom: 20px;
    }
    .song-title {
      font-size: 0.85rem;
      color: #636e72;
      font-style: italic;
    }
    /* Kalp Animasyonları */
    .heart {
      position: absolute;
      color: #ff4b2b;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      animation: floatUp 4s linear infinite;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Müzik Dosyası (Aynı klasörde 'sezen.mp3' olmalı) -->
  <audio id="bg-music" src="sezen.mp3" preload="auto"></audio>

  <!-- Giriş Butonu -->
  <div id="start-screen">
    <button class="start-btn" onclick="startSurprise()">Sürprizi Başlat ✨</button>
  </div>

  <!-- Sürpriz İçeriği -->
  <div id="content">
    <!-- Fotoğrafınızı 'foto.jpg' adıyla aynı klasöre koyabilirsiniz -->
    <img src="foto.jpg" alt="Biz" class="photo" onerror="this.style.display='none'">
    
    <h1>Sende Tutsak Kaldım... ❤️</h1>
    
    <p id="typed-text">
      Hayatımda olduğun her gün için teşekkür ederim. İyi ki varsın, seni çok seviyorum!
    </p>

    <div class="song-title">🎵 Sezen Aksu - Sende Tutsak Kaldım</div>
  </div>

  <script>
    function startSurprise() {
      // Müziği Başlat
      const music = document.getElementById('bg-music');
      music.play();

      // Giriş ekranını gizle, içeriği göster
      document.getElementById('start-screen').style.display = 'none';
      const content = document.getElementById('content');
      content.style.display = 'block';
      setTimeout(() => {
        content.style.opacity = '1';
      }, 50);

      // Kalp yağmurunu başlat
      setInterval(createHeart, 300);
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = Math.random() * 2 + 3 + 's';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }
  </script>
</body>
</html>
